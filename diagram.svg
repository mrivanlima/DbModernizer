<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1e2e"/>
      <stop offset="100%" stop-color="#0f2c40"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Region A -->
  <rect x="60" y="120" width="340" height="380" rx="14" fill="#0d3b52" stroke="#1ba1a8" stroke-width="2"/>
  <text x="230" y="155" text-anchor="middle" fill="#7fe8e0" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Region: us-east-1</text>

  <rect x="100" y="190" width="260" height="90" rx="10" fill="#124a63" stroke="#2fc2c7" stroke-width="1.5"/>
  <text x="230" y="222" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Primary Database</text>
  <text x="230" y="248" text-anchor="middle" fill="#bfe9ec" font-family="Arial, sans-serif" font-size="13">available_stock = 500</text>

  <rect x="100" y="320" width="260" height="90" rx="10" fill="#173b2b" stroke="#3ecf8e" stroke-width="1.5"/>
  <text x="230" y="352" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Agent A</text>
  <text x="230" y="378" text-anchor="middle" fill="#bdf2d6" font-family="Arial, sans-serif" font-size="13">writes: stock = 500</text>

  <line x1="230" y1="320" x2="230" y2="282" stroke="#3ecf8e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Lag arrow between regions -->
  <line x1="400" y1="235" x2="800" y2="235" stroke="#e0a72e" stroke-width="3" stroke-dasharray="10,8" marker-end="url(#arrowY)"/>
  <text x="600" y="215" text-anchor="middle" fill="#f0c05a" font-family="Arial, sans-serif" font-size="15" font-weight="bold">replication lag: 2s+</text>

  <!-- Region B -->
  <rect x="800" y="120" width="340" height="380" rx="14" fill="#4a1520" stroke="#e0475c" stroke-width="2"/>
  <text x="970" y="155" text-anchor="middle" fill="#ff9baa" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Region: ap-south-1</text>

  <rect x="840" y="190" width="260" height="90" rx="10" fill="#5c1c28" stroke="#e0475c" stroke-width="1.5"/>
  <text x="970" y="222" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Lagging Replica</text>
  <text x="970" y="248" text-anchor="middle" fill="#ffd0d8" font-family="Arial, sans-serif" font-size="13">available_stock = 0 (stale)</text>

  <rect x="840" y="320" width="260" height="90" rx="10" fill="#5c1c28" stroke="#e0475c" stroke-width="1.5"/>
  <text x="970" y="350" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Agent B</text>
  <text x="970" y="376" text-anchor="middle" fill="#ffd0d8" font-family="Arial, sans-serif" font-size="13">reads stale value,</text>
  <text x="970" y="396" text-anchor="middle" fill="#ffd0d8" font-family="Arial, sans-serif" font-size="13">triggers "Sold Out"</text>

  <line x1="970" y1="320" x2="970" y2="282" stroke="#e0475c" stroke-width="2.5" marker-end="url(#arrowR)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3ecf8e"/>
    </marker>
    <marker id="arrowY" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e0a72e"/>
    </marker>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e0475c"/>
    </marker>
  </defs>

  <text x="600" y="555" text-anchor="middle" fill="#9fb8c8" font-family="Arial, sans-serif" font-size="16">Autonomous agents treat stale replica reads as current fact --</text>
  <text x="600" y="580" text-anchor="middle" fill="#9fb8c8" font-family="Arial, sans-serif" font-size="16">and act on them before replication catches up.</text>
</svg>
