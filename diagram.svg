<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0a1e2e"/>
  <text x="600" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#e8f4f8" text-anchor="middle">AI-Generated Rollback: Schema Reversed, Data Lost</text>

  <!-- Timeline -->
  <line x1="100" y1="150" x2="1100" y2="150" stroke="#2a5a6e" stroke-width="3"/>

  <!-- Forward migration node -->
  <circle cx="220" cy="150" r="14" fill="#2dd4bf"/>
  <text x="220" y="115" font-family="Arial" font-size="18" fill="#2dd4bf" text-anchor="middle">Forward Migration</text>
  <text x="220" y="185" font-family="Arial" font-size="14" fill="#9fc9d6" text-anchor="middle">Add column</text>
  <text x="220" y="205" font-family="Arial" font-size="14" fill="#9fc9d6" text-anchor="middle">payment_method_id</text>

  <!-- Data written window -->
  <rect x="300" y="140" width="500" height="20" fill="#1a4a5a" opacity="0.6"/>
  <text x="550" y="240" font-family="Arial" font-size="16" fill="#f0b429" text-anchor="middle">Weeks pass — new data written only into new column</text>
  <text x="550" y="262" font-family="Arial" font-size="14" fill="#c9dde3" text-anchor="middle">Rollback script never regenerated to reflect this</text>

  <!-- Rollback trigger node -->
  <circle cx="820" cy="150" r="14" fill="#f0576a"/>
  <text x="820" y="115" font-family="Arial" font-size="18" fill="#f0576a" text-anchor="middle">Rollback Triggered</text>
  <text x="820" y="185" font-family="Arial" font-size="14" fill="#9fc9d6" text-anchor="middle">Unrelated incident</text>
  <text x="820" y="205" font-family="Arial" font-size="14" fill="#9fc9d6" text-anchor="middle">forces revert</text>

  <!-- Result -->
  <rect x="920" y="120" width="180" height="60" rx="8" fill="#3a1520" stroke="#f0576a" stroke-width="2"/>
  <text x="1010" y="145" font-family="Arial" font-size="14" fill="#f0576a" text-anchor="middle" font-weight="bold">DROP COLUMN</text>
  <text x="1010" y="165" font-family="Arial" font-size="13" fill="#f0b4bd" text-anchor="middle">succeeds silently</text>

  <!-- Bottom comparison -->
  <rect x="80" y="330" width="480" height="230" rx="12" fill="#0f2a3a" stroke="#2a5a6e" stroke-width="2"/>
  <text x="320" y="365" font-family="Arial" font-size="20" font-weight="bold" fill="#2dd4bf" text-anchor="middle">What the rollback reverses</text>
  <text x="110" y="405" font-family="Arial" font-size="15" fill="#c9dde3">✓ New column definition</text>
  <text x="110" y="435" font-family="Arial" font-size="15" fill="#c9dde3">✓ New constraint</text>
  <text x="110" y="465" font-family="Arial" font-size="15" fill="#c9dde3">✓ Index on new column</text>
  <text x="110" y="495" font-family="Arial" font-size="15" fill="#c9dde3">✓ Schema version marker</text>
  <text x="110" y="535" font-family="Arial" font-size="14" fill="#7fa8b8" font-style="italic">Purely mechanical DDL reversal</text>

  <rect x="640" y="330" width="480" height="230" rx="12" fill="#3a1520" stroke="#f0576a" stroke-width="2"/>
  <text x="880" y="365" font-family="Arial" font-size="20" font-weight="bold" fill="#f0576a" text-anchor="middle">What the rollback ignores</text>
  <text x="670" y="405" font-family="Arial" font-size="15" fill="#f0c4cc">✗ Rows written since migration ran</text>
  <text x="670" y="435" font-family="Arial" font-size="15" fill="#f0c4cc">✗ Which expand-contract phase it's in</text>
  <text x="670" y="465" font-family="Arial" font-size="15" fill="#f0c4cc">✗ Downstream systems (cache, search)</text>
  <text x="670" y="495" font-family="Arial" font-size="15" fill="#f0c4cc">✗ Compliance/retention exposure</text>
  <text x="670" y="535" font-family="Arial" font-size="14" fill="#c98a94" font-style="italic">No error thrown — fails silently</text>

  <text x="600" y="610" font-family="Arial" font-size="13" fill="#5a8a9a" text-anchor="middle">dataplatformadvisory.com — 8 Pillars: Automated Operations &amp; CI/CD</text>
</svg>
