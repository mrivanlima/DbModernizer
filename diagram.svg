<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1e2e"/>
      <stop offset="1" stop-color="#0f2f3f"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5ad1c9"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e8756a"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <text x="60" y="60" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#eaf6f5">Two paths into production</text>

  <!-- Agent laptop -->
  <rect x="60" y="110" width="200" height="120" rx="10" fill="#123a4a" stroke="#5ad1c9" stroke-width="2"/>
  <text x="160" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#eaf6f5">Developer laptop</text>
  <text x="160" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#9fd8d3">AI coding agent</text>
  <text x="160" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#7fb8b3">+ local MCP server</text>

  <!-- Git/CI/CD path (governed) -->
  <rect x="60" y="300" width="200" height="90" rx="10" fill="#123a4a" stroke="#5ad1c9" stroke-width="2"/>
  <text x="160" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#eaf6f5">Git commit</text>
  <text x="160" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#9fd8d3">Pull request</text>

  <rect x="340" y="300" width="220" height="90" rx="10" fill="#123a4a" stroke="#5ad1c9" stroke-width="2"/>
  <text x="450" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#eaf6f5">CI/CD pipeline</text>
  <text x="450" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#9fd8d3">Review + tests + approval</text>

  <!-- Direct MCP path (ungoverned) -->
  <rect x="340" y="110" width="220" height="120" rx="10" fill="#3a1518" stroke="#e8756a" stroke-width="2"/>
  <text x="450" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#f6d9d5">Direct MCP write</text>
  <text x="450" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#f0b0a8">No review</text>
  <text x="450" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#e89a90">No audit trail</text>

  <!-- Database -->
  <g transform="translate(700,235)">
    <ellipse cx="180" cy="0" rx="120" ry="30" fill="#164a5c" stroke="#5ad1c9" stroke-width="2"/>
    <path d="M60,0 L60,140 A120,30 0 0,0 300,140 L300,0" fill="#123a4a" stroke="#5ad1c9" stroke-width="2"/>
    <ellipse cx="180" cy="140" rx="120" ry="30" fill="#123a4a" stroke="#5ad1c9" stroke-width="2"/>
    <ellipse cx="180" cy="70" rx="120" ry="30" fill="none" stroke="#3d7d80" stroke-width="1.5"/>
    <text x="180" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#eaf6f5">Production</text>
    <text x="180" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#9fd8d3">Database</text>
  </g>

  <!-- arrows -->
  <path d="M260,170 L340,170" stroke="#e8756a" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/>
  <path d="M560,170 C 650,170 700,200 760,255" stroke="#e8756a" stroke-width="3" fill="none" marker-end="url(#arrowRed)" stroke-dasharray="2,6"/>

  <path d="M160,230 L160,300" stroke="#5ad1c9" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M260,345 L340,345" stroke="#5ad1c9" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M560,345 C 650,345 700,320 760,300" stroke="#5ad1c9" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <text x="450" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="#e8756a">bypasses the gate</text>
  <text x="450" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="#5ad1c9">reviewed change</text>

  <text x="60" y="480" font-family="Arial, sans-serif" font-size="15" fill="#9fd8d3">86% of MCP servers run locally on developer machines, outside any governed environment.</text>
  <text x="60" y="505" font-family="Arial, sans-serif" font-size="13" fill="#6fa6a1">Source: Clutch Security, cited in Practical DevSecOps MCP Security Statistics 2026</text>
</svg>
