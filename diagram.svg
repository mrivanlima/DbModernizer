<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1f33"/>
      <stop offset="100%" stop-color="#0d2b3e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#e6f2f5">Commit Volume vs. Review Capacity</text>
  <text x="60" y="100" font-family="Arial, sans-serif" font-size="16" fill="#7fb8c9">AI agents accelerate input; human review capacity stays flat</text>

  <!-- Axes -->
  <line x1="120" y1="500" x2="1120" y2="500" stroke="#3d6b7d" stroke-width="2"/>
  <line x1="120" y1="150" x2="120" y2="500" stroke="#3d6b7d" stroke-width="2"/>
  <text x="1080" y="525" font-family="Arial, sans-serif" font-size="14" fill="#7fb8c9">Time</text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="14" fill="#7fb8c9">Volume</text>

  <!-- Commit volume line (rising, teal) -->
  <polyline points="120,460 300,410 480,330 660,240 840,180 1020,150"
            fill="none" stroke="#2dd4bf" stroke-width="5"/>
  <text x="900" y="140" font-family="Arial, sans-serif" font-size="16" fill="#2dd4bf" font-weight="bold">AI-driven commit volume</text>

  <!-- Review capacity line (flat, amber) -->
  <polyline points="120,440 300,435 480,432 660,430 840,428 1020,426"
            fill="none" stroke="#f0a94e" stroke-width="5"/>
  <text x="820" y="450" font-family="Arial, sans-serif" font-size="16" fill="#f0a94e" font-weight="bold">Human review capacity</text>

  <!-- Gap shading -->
  <polygon points="120,460 300,410 480,330 660,240 840,180 1020,150 1020,426 840,428 660,430 480,432 300,435 120,440"
           fill="#e2555555" opacity="0.15"/>

  <!-- Gap label -->
  <text x="640" y="330" font-family="Arial, sans-serif" font-size="18" fill="#ff8a80" font-weight="bold">Unreviewed blast radius</text>

  <!-- Bottom icons row: pipeline nodes -->
  <g font-family="Arial, sans-serif" font-size="13" fill="#cfe8ee">
    <circle cx="180" cy="580" r="8" fill="#2dd4bf"/>
    <text x="200" y="585">Agent commit</text>

    <circle cx="380" cy="580" r="8" fill="#f0a94e"/>
    <text x="400" y="585">CI pipeline</text>

    <circle cx="580" cy="580" r="8" fill="#ff8a80"/>
    <text x="600" y="585">Schema migration</text>

    <circle cx="820" cy="580" r="8" fill="#2dd4bf"/>
    <text x="840" y="585">Production database</text>
  </g>
</svg>
