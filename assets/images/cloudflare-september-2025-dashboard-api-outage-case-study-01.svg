<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<rect width="1200" height="630" fill="#0F2540"/>
<text x="60" y="65" font-family="Georgia, serif" font-size="28" fill="#FFFFFF" font-weight="bold">Anatomy of Cloudflare's Sept 12, 2025 Dashboard Outage</text>
<text x="60" y="95" font-family="Arial, sans-serif" font-size="15" fill="#C9D9E3">A useEffect bug, a service deploy, and a control-plane cascade</text>

<!-- 5 step flow -->
<g font-family="Arial, sans-serif">
<rect x="50" y="140" width="200" height="150" rx="10" fill="#132C4A" stroke="#8FD3C7" stroke-width="2"/>
<text x="150" y="170" font-size="15" fill="#8FD3C7" text-anchor="middle" font-weight="bold">16:32 UTC</text>
<text x="65" y="200" font-size="12" fill="#FFFFFF">Dashboard release</text>
<text x="65" y="218" font-size="12" fill="#FFFFFF">ships buggy useEffect</text>
<text x="65" y="236" font-size="12" fill="#FFFFFF">-- refetches on every</text>
<text x="65" y="254" font-size="12" fill="#FFFFFF">render, with retries</text>

<rect x="270" y="140" width="200" height="150" rx="10" fill="#132C4A" stroke="#8FD3C7" stroke-width="2"/>
<text x="370" y="170" font-size="15" fill="#8FD3C7" text-anchor="middle" font-weight="bold">17:50 UTC</text>
<text x="285" y="200" font-size="12" fill="#FFFFFF">New Tenant Service</text>
<text x="285" y="218" font-size="12" fill="#FFFFFF">version deploys</text>
<text x="285" y="236" font-size="12" fill="#FFFFFF">while call volume</text>
<text x="285" y="254" font-size="12" fill="#FFFFFF">is already climbing</text>

<rect x="490" y="140" width="200" height="150" rx="10" fill="#132C4A" stroke="#8FD3C7" stroke-width="2"/>
<text x="590" y="170" font-size="15" fill="#8FD3C7" text-anchor="middle" font-weight="bold">17:57 UTC</text>
<text x="505" y="200" font-size="12" fill="#FFFFFF">Tenant Service</text>
<text x="505" y="218" font-size="12" fill="#FFFFFF">overwhelmed --</text>
<text x="505" y="236" font-size="12" fill="#FFFFFF">dashboard availability</text>
<text x="505" y="254" font-size="12" fill="#FFFFFF">begins dropping</text>

<rect x="710" y="140" width="200" height="150" rx="10" fill="#132C4A" stroke="#8FD3C7" stroke-width="2"/>
<text x="810" y="170" font-size="15" fill="#8FD3C7" text-anchor="middle" font-weight="bold">18:58 UTC</text>
<text x="725" y="200" font-size="12" fill="#FFFFFF">Fix attempt makes</text>
<text x="725" y="218" font-size="12" fill="#FFFFFF">it worse -- a second</text>
<text x="725" y="236" font-size="12" fill="#FFFFFF">Tenant Service change</text>
<text x="725" y="254" font-size="12" fill="#FFFFFF">re-spikes impact</text>

<rect x="930" y="140" width="220" height="150" rx="10" fill="#132C4A" stroke="#8FD3C7" stroke-width="2"/>
<text x="1040" y="170" font-size="15" fill="#8FD3C7" text-anchor="middle" font-weight="bold">19:12 UTC</text>
<text x="945" y="200" font-size="12" fill="#FFFFFF">Bad change reverted,</text>
<text x="945" y="218" font-size="12" fill="#FFFFFF">dashboard restored</text>
<text x="945" y="236" font-size="12" fill="#FFFFFF">to 100% availability</text>
<text x="945" y="254" font-size="12" fill="#FFFFFF">IMPACT END</text>

<polygon points="250,210 268,200 268,220" fill="#8FD3C7"/>
<polygon points="470,210 488,200 488,220" fill="#8FD3C7"/>
<polygon points="690,210 708,200 708,220" fill="#8FD3C7"/>
<polygon points="910,210 928,200 928,220" fill="#8FD3C7"/>
</g>

<rect x="50" y="330" width="1100" height="220" rx="10" fill="#132C4A" stroke="#3A4A5A" stroke-width="1"/>
<text x="80" y="370" font-family="Georgia, serif" font-size="20" fill="#8FD3C7" font-weight="bold">Why the control plane mattered here</text>
<text x="80" y="405" font-family="Arial, sans-serif" font-size="15" fill="#FFFFFF">Tenant Service sits inside API request authorization -- when it goes down, every API call</text>
<text x="80" y="428" font-family="Arial, sans-serif" font-size="15" fill="#FFFFFF">fails authorization and returns 5xx, even though the CDN / edge data plane never lost service.</text>
<text x="80" y="463" font-family="Arial, sans-serif" font-size="15" fill="#FFFFFF">A frontend bug, a backend capacity limit, and a shared auth dependency combined to turn</text>
<text x="80" y="486" font-family="Arial, sans-serif" font-size="15" fill="#FFFFFF">one bad deploy into an hour-long outage of the dashboard and related APIs.</text>

<text x="60" y="600" font-family="Arial, sans-serif" font-size="14" fill="#C9D9E3">Data Platform Advisory · Real Incidents Series · dataplatformadvisory.com</text>
</svg>
