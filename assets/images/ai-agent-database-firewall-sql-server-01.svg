<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1e2e"/>
      <stop offset="100%" stop-color="#0f2d3d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <text x="60" y="65" font-family="Georgia, serif" font-size="28" fill="#e6f4f1" font-weight="bold">AgentDBGuard: A Firewall Inside the Transaction</text>
  <text x="60" y="92" font-family="Arial, sans-serif" font-size="15" fill="#7fb8ac">Classify -&gt; gate -&gt; audit, before commit</text>

  <!-- Agent box -->
  <rect x="60" y="140" width="180" height="70" rx="8" fill="#123847" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="150" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#e6f4f1">AI Agent</text>
  <text x="150" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9fd6cc">submits SQL</text>

  <!-- arrow -->
  <line x1="240" y1="175" x2="310" y2="175" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Guard box -->
  <rect x="310" y="120" width="260" height="110" rx="8" fill="#16404f" stroke="#f0b429" stroke-width="2"/>
  <text x="440" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#f0b429" font-weight="bold">AgentDBGuard</text>
  <text x="440" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e6f4f1">1. classify DDL / write / read</text>
  <text x="440" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e6f4f1">2. require WHERE on UPDATE/DELETE</text>
  <text x="440" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e6f4f1">3. measure rowcount before commit</text>

  <line x1="570" y1="175" x2="640" y2="175" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Database box -->
  <rect x="640" y="140" width="200" height="70" rx="8" fill="#123847" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="740" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#e6f4f1">SQL Server 2025</text>
  <text x="740" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9fd6cc">temporal table</text>

  <!-- Blocked path -->
  <line x1="440" y1="230" x2="440" y2="300" stroke="#e05252" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowred)"/>
  <rect x="330" y="300" width="220" height="60" rx="8" fill="#3a1620" stroke="#e05252" stroke-width="1.5"/>
  <text x="440" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#f5a3a3">BLOCKED</text>
  <text x="440" y="343" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e6c2c2">rolled back before commit</text>

  <!-- Audit table -->
  <line x1="440" y1="360" x2="440" y2="420" stroke="#f0b429" stroke-width="2" marker-end="url(#arrowgold)"/>
  <line x1="740" y1="210" x2="740" y2="420" stroke="#2dd4bf" stroke-width="2"/>
  <line x1="440" y1="420" x2="740" y2="420" stroke="#f0b429" stroke-width="2"/>
  <rect x="380" y="430" width="480" height="90" rx="8" fill="#16332a" stroke="#f0b429" stroke-width="1.5"/>
  <text x="620" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#f0e0a0" font-weight="bold">agent_sql_audit</text>
  <text x="620" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e6f4f1">independent transaction — logs every attempt,</text>
  <text x="620" y="497" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e6f4f1">approved or blocked, survives rollback</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2dd4bf"/></marker>
    <marker id="arrowred" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e05252"/></marker>
    <marker id="arrowgold" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f0b429"/></marker>
  </defs>

  <text x="60" y="590" font-family="Arial, sans-serif" font-size="13" fill="#5f9089">dataplatformadvisory.com</text>
  <text x="1140" y="590" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#5f9089">Real Incidents: AI Agent DB Firewall</text>
</svg>
