<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1f2e"/>
      <stop offset="100%" stop-color="#0d2b3e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3fa796"/>
    </marker>
    <marker id="arrow-r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e05c5c"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <text x="600" y="52" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#e8f4f8" text-anchor="middle">Where Agent Identity Disappears</text>
  <text x="600" y="80" font-family="Arial, sans-serif" font-size="15" fill="#7fd4c9" text-anchor="middle">Unique cryptographic IDs at the identity provider, one shared login at the database</text>

  <!-- Agents with unique identity -->
  <rect x="70" y="130" width="150" height="70" rx="10" fill="#155263" stroke="#7fd4c9" stroke-width="2.5"/>
  <text x="145" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Agent A</text>
  <text x="145" y="180" font-family="Arial, sans-serif" font-size="11" fill="#a9e0d8" text-anchor="middle">unique ID: a7f2...</text>

  <rect x="70" y="230" width="150" height="70" rx="10" fill="#155263" stroke="#7fd4c9" stroke-width="2.5"/>
  <text x="145" y="260" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Agent B</text>
  <text x="145" y="280" font-family="Arial, sans-serif" font-size="11" fill="#a9e0d8" text-anchor="middle">unique ID: c91d...</text>

  <rect x="70" y="330" width="150" height="70" rx="10" fill="#155263" stroke="#7fd4c9" stroke-width="2.5"/>
  <text x="145" y="360" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Agent C</text>
  <text x="145" y="380" font-family="Arial, sans-serif" font-size="11" fill="#a9e0d8" text-anchor="middle">unique ID: 4b6e...</text>

  <text x="145" y="440" font-family="Arial, sans-serif" font-size="12" fill="#7fd4c9" text-anchor="middle">200 agents, 200 identities</text>
  <text x="145" y="458" font-family="Arial, sans-serif" font-size="11" fill="#9fd8cf" text-anchor="middle">(Entra Agent ID / Gemini Agent Identity)</text>

  <!-- Arrows to gateway/idp check -->
  <line x1="220" y1="165" x2="330" y2="230" stroke="#3fa796" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="220" y1="265" x2="330" y2="260" stroke="#3fa796" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="220" y1="365" x2="330" y2="290" stroke="#3fa796" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- IdP verification box -->
  <rect x="335" y="205" width="170" height="100" rx="10" fill="#134e5e" stroke="#7fd4c9" stroke-width="2.5"/>
  <text x="420" y="240" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Identity Provider</text>
  <text x="420" y="260" font-family="Arial, sans-serif" font-size="11" fill="#a9e0d8" text-anchor="middle">verifies + logs</text>
  <text x="420" y="277" font-family="Arial, sans-serif" font-size="11" fill="#a9e0d8" text-anchor="middle">each agent's token</text>
  <text x="420" y="294" font-family="Arial, sans-serif" font-size="11" fill="#7fd4c9" text-anchor="middle">full audit fidelity</text>

  <!-- Arrow from IdP into pooler, funnel shape -->
  <path d="M 505 255 L 610 255" stroke="#e8b84b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="558" y="240" font-family="Arial, sans-serif" font-size="11" fill="#f2d489" text-anchor="middle">app checks out</text>
  <text x="558" y="275" font-family="Arial, sans-serif" font-size="11" fill="#f2d489" text-anchor="middle">pooled connection</text>

  <!-- Funnel / pooler -->
  <polygon points="615,190 785,190 715,320 685,320" fill="#1d3b4a" stroke="#e8b84b" stroke-width="2.5"/>
  <text x="700" y="220" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#f2d489" text-anchor="middle">Connection</text>
  <text x="700" y="238" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#f2d489" text-anchor="middle">Pooler</text>
  <text x="700" y="258" font-family="Arial, sans-serif" font-size="10" fill="#e8d9a8" text-anchor="middle">(PgBouncer / RDS Proxy)</text>
  <text x="700" y="276" font-family="Arial, sans-serif" font-size="10" fill="#e8d9a8" text-anchor="middle">no OAuth passthrough</text>

  <!-- Arrow from funnel to db -->
  <line x1="710" y1="320" x2="710" y2="365" stroke="#e05c5c" stroke-width="3.5" marker-end="url(#arrow-r)"/>

  <!-- Database -->
  <g>
    <ellipse cx="710" cy="400" rx="90" ry="20" fill="#1d3b4a" stroke="#e05c5c" stroke-width="2.5"/>
    <path d="M 620 400 L 620 470 A 90 20 0 0 0 800 470 L 800 400" fill="#1d3b4a" stroke="#e05c5c" stroke-width="2.5"/>
    <ellipse cx="710" cy="470" rx="90" ry="20" fill="none" stroke="#e05c5c" stroke-width="2"/>
  </g>
  <text x="710" y="408" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Database</text>

  <!-- Log showing one shared login -->
  <rect x="850" y="150" width="290" height="340" rx="10" fill="#12222c" stroke="#e05c5c" stroke-width="2"/>
  <text x="995" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#f5b8b8" text-anchor="middle">Database Query Log</text>
  <line x1="870" y1="195" x2="1120" y2="195" stroke="#3a4a52" stroke-width="1"/>
  <text x="870" y="220" font-family="monospace" font-size="11" fill="#d9d9d9">user: svc_agent_pool</text>
  <text x="870" y="242" font-family="monospace" font-size="11" fill="#d9d9d9">SELECT * FROM orders...</text>
  <text x="870" y="264" font-family="monospace" font-size="11" fill="#d9d9d9">user: svc_agent_pool</text>
  <text x="870" y="286" font-family="monospace" font-size="11" fill="#d9d9d9">UPDATE customers SET...</text>
  <text x="870" y="308" font-family="monospace" font-size="11" fill="#d9d9d9">user: svc_agent_pool</text>
  <text x="870" y="330" font-family="monospace" font-size="11" fill="#d9d9d9">SELECT * FROM invoices...</text>
  <text x="870" y="352" font-family="monospace" font-size="11" fill="#d9d9d9">user: svc_agent_pool</text>
  <text x="870" y="374" font-family="monospace" font-size="11" fill="#d9d9d9">DELETE FROM sessions...</text>
  <line x1="870" y1="392" x2="1120" y2="392" stroke="#3a4a52" stroke-width="1"/>
  <text x="995" y="418" font-family="Arial, sans-serif" font-size="12" fill="#e88888" text-anchor="middle" font-style="italic">Same login on every line.</text>
  <text x="995" y="438" font-family="Arial, sans-serif" font-size="12" fill="#e88888" text-anchor="middle" font-style="italic">Which of 200 agents ran</text>
  <text x="995" y="458" font-family="Arial, sans-serif" font-size="12" fill="#e88888" text-anchor="middle" font-style="italic">the DELETE? Unknown.</text>

  <!-- Bottom caption -->
  <rect x="70" y="530" width="1060" height="70" rx="8" fill="#0f2530" stroke="#3fa796" stroke-width="1.5"/>
  <text x="600" y="558" font-family="Arial, sans-serif" font-size="13" fill="#c9e8e2" text-anchor="middle">Entra Agent ID and Gemini Agent Identity (GA, April 2026) issue unique identities per agent —</text>
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="13" fill="#c9e8e2" text-anchor="middle">but PgBouncer and most connection poolers still authenticate pooled connections with one shared credential.</text>
</svg>
