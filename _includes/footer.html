<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">
    <div class="footer-col-wrapper">
      <div class="footer-col footer-col-1">
        <ul class="contact-list">
          <li class="p-name">{{ site.title | escape }}</li>
          {%- if site.email %}
          <li><a class="u-email" href="mailto:{{ site.email }}">{{ site.email }}</a></li>
          {%- endif %}
        </ul>
      </div>

      <div class="footer-col footer-col-2">
        <ul class="social-media-list">
          <li><a href="https://www.linkedin.com/in/mrivanlima/" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
          <li><a href="https://github.com/mrivanlima" target="_blank" rel="noopener noreferrer">GitHub</a></li>
          <li><a href="https://x.com/MrIvanLima" target="_blank" rel="noopener noreferrer">X</a></li>
          <li><a href="{{ "/feed.xml" | relative_url }}">RSS</a></li>
        </ul>
      </div>

      <div class="footer-col footer-col-3">
        <p>{{ site.description | escape }}</p>
      </div>
    </div>

    <div class="footer-copyright" style="margin-top: 20px; font-size: 14px; color: #828282;">
      <p>&copy; {{ site.time | date: '%Y' }} Ivan Lima. All rights reserved.</p>
    </div>
  </div>
</footer>
